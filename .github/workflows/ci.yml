name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t j1939-build docker/

      - name: Build and run unit tests
        run: docker run --rm -v "$PWD":/src j1939-build bash -c "cmake -S . -B build-docker -G Ninja && cmake --build build-docker && ./build-docker/unit_tests"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest python-can

      - name: Run simulator tests
        run: python -m pytest -v

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t j1939-build docker/

      - name: Unit tests with ASan + UBSan
        run: docker run --rm --cap-add SYS_PTRACE -v "$PWD":/src j1939-build bash -c "cmake -S . -B build-asan -G Ninja -DJ1939MON_SANITIZE=ON && cmake --build build-asan && ./build-asan/unit_tests"
